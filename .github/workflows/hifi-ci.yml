name: HiFi CI — cicd_test_v3
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Static HTML Assets
      run: test -f index.html || find . -name '*.html'
    - name: Validate HTML
      run: npx htmlhint **/*.html || true
    - name: Verify Build
      run: echo 'Static web assets verified successfully'
    - name: Build Docker image
      run: docker build -t cicd_test_v3 .
