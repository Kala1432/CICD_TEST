name: Build, Scan, Test and Deploy

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kala1432/cicd_test_v3

jobs:

  # ============================================================
  # 1. BUILD AND PUSH
  # ============================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image digest
        run: |
          echo "Image digest:"
          echo "${{ steps.docker_build.outputs.digest }}"


  # ============================================================
  # 2. TRIVY SECURITY SCAN
  # ============================================================
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif


  # ============================================================
  # 3. TEST DOCKER IMAGE
  # ============================================================
  test:
    name: Test Docker Image
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read

    steps:

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ${{ needs.build.outputs.image }}:latest

      - name: Run container
        run: |
          docker run -d \
            --name html-test \
            -p 8080:80 \
            ${{ needs.build.outputs.image }}:latest

      - name: Wait for Nginx
        run: |
          sleep 5

      - name: Test website
        run: |
          curl --fail http://localhost:8080/

      - name: Show container logs
        if: always()
        run: |
          docker logs html-test

      - name: Stop container
        if: always()
        run: |
          docker stop html-test || true
          docker rm html-test || true


  # ============================================================
  # 4. DEPLOY TO EC2
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - build
      - security-scan
      - test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: read

    steps:

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          port: ${{ secrets.EC2_PORT }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "===================================="
            echo "Starting EC2 deployment"
            echo "===================================="

            echo "Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin

            echo "Pulling latest Docker image..."

            docker pull ghcr.io/kala1432/cicd_test_v3:latest

            echo "Stopping old container..."

            docker stop htmlcicd || true

            echo "Removing old container..."

            docker rm htmlcicd || true

            echo "Starting new container..."

            docker run -d \
              --name htmlcicd \
              --restart unless-stopped \
              -p 80:80 \
              ghcr.io/kala1432/cicd_test_v3:latest

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "===================================="
            echo "Deployment completed!"
            echo "===================================="