<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background: linear-gradient(135deg, #ffc1d3, #ffe5ec);
        }

        .login-container{
            width:350px;
            background:<h2 id=""></h2>;
            padding:35px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color:#558;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        .input-group input:focus{
            border-color:#4facfe;
            outline:none;
        }

        .options{
            display:flex;
            justify-content:space-between;
            font-size:14px;
            margin-bottom:20px;
        }

        .options a{
            text-decoration:none;
            color:#4facfe;
        }

        button{
            width:100%;
            padding:12px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#007bff;
        }

        .register{
            text-align:center;
            margin-top:18px;
            font-size:14px;
        }

        .register a{
            color:#4facfe;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="login-container">

    <h2>Login</h2>

    <form action="/login" method="POST">

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> Remember Me
            </label>

            <a href="/forgot-password">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

        <div class="register">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

    </form>

</div>

</body>
</html>
